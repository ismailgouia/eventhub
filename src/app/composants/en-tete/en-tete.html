
<header>
  <div class="logo">
    <a routerLink="/evenements">EventHub</a>
  </div>

  <nav>
    <a
      routerLink="/evenements"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      Événements
    </a>

    <a routerLink="/mes-reservations" routerLinkActive="active">
      Mes réservations ({{ reservations.nombreReservations() }})
    </a>

    @if (session.estConnecte()) {
      <span>Bienvenue, {{ session.utilisateur()?.nom }}</span>

      <button (click)="session.deconnecter()">
        Déconnexion
      </button>
    } @else {
      <a routerLink="/connexion" routerLinkActive="active">
        Connexion
      </a>
    }

    @if (session.estOrganisateur()) {
      <a
        routerLink="/nouvel-evenement"
        routerLinkActive="active"
      >
        Nouvel événement
      </a>
    }
  </nav>
</header>
